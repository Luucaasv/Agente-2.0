<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Remote Chat</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
    <!-- Pinned versions + integrity hashes: a new release on the CDN
         can't change or break rendering without you updating these. -->
    <script
        src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
        integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
        crossorigin="anonymous"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"
        integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx"
        crossorigin="anonymous"
    ></script>
</head>

<body>

<main class="app">

    <!-- HEADER -->

    <header class="topbar">

        <div>

            <h1>
                Ollama Chat
            </h1>

            <p
                id="status"
                class="status"
            >
                Connecting...
            </p>

        </div>

        <div class="topbar-right">

            <div class="model-container">

                <label for="model">
                    Model
                </label>

                <select id="model">
                    <option>
                        Loading models...
                    </option>
                </select>

            </div>

            <div class="model-container">

                <label for="preset">
                    Role
                </label>

                <select id="preset">
                    <option value="">
                        No role
                    </option>
                </select>

            </div>

            <div class="header-buttons">

                <button
                    id="history-button"
                    class="ghost-button"
                    type="button"
                >
                    History
                </button>

                <button
                    id="edit-roles"
                    class="ghost-button"
                    type="button"
                >
                    Roles
                </button>

                <button
                    id="new-chat"
                    class="ghost-button"
                    type="button"
                >
                    New chat
                </button>

            </div>

        </div>

    </header>


    <!-- CHAT -->

    <section
        id="chat"
        class="chat"
    >

        <div class="welcome">

            <div class="welcome-icon">
                ✦
            </div>

            <h2>
                Remote AI Assistant
            </h2>

            <p>
                Send a message or attach an image.
            </p>

        </div>

    </section>


    <!-- IMAGE PREVIEW -->

    <section
        id="attachment"
        class="attachment hidden"
    >

        <img
            id="preview"
            alt="Selected image"
        >

        <div class="attachment-info">

            <strong id="filename"></strong>

            <button
                id="remove-image"
                type="button"
            >
                Remove
            </button>

        </div>

    </section>


    <!-- COMPOSER -->

    <form
        id="composer"
        class="composer"
    >

        <input
            id="image-input"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
            hidden
        >

        <button
            id="attach-button"
            class="icon-button"
            type="button"
            title="Attach image"
        >
            +
        </button>

        <textarea
            id="prompt"
            rows="1"
            placeholder="Message your model..."
        ></textarea>

        <button
            id="send-button"
            class="send-button"
            type="submit"
        >
            Send
        </button>

    </form>


    <!-- FOOTER -->

    <footer>

        <span>
            Ollama via Tailscale
        </span>

        <span>
            •
        </span>

        <span>
            Remote inference
        </span>

    </footer>

</main>

<!-- CHAT HISTORY -->

<dialog id="history-dialog">

    <div class="history">

        <h2>Chat history</h2>

        <p id="history-empty" class="history-empty hidden">
            No saved chats yet.
        </p>

        <ul id="history-list" class="history-list"></ul>

        <div class="role-actions">

            <span class="spacer"></span>

            <button
                id="history-close"
                class="ghost-button"
                type="button"
            >
                Close
            </button>

        </div>

    </div>

</dialog>

<!-- ROLE EDITOR -->

<dialog id="role-dialog">

    <form id="role-form" class="role-form">

        <h2>Roles</h2>

        <label for="role-list">Edit</label>
        <select id="role-list"></select>

        <label for="role-name">Name</label>
        <input
            id="role-name"
            type="text"
            maxlength="60"
            placeholder="e.g. Photo describer"
            autocomplete="off"
        >

        <label for="role-text">Role</label>
        <textarea
            id="role-text"
            rows="5"
            placeholder="Who the model should be and how it should answer."
        ></textarea>

        <label for="role-context">
            Context <span class="optional">(optional)</span>
        </label>
        <textarea
            id="role-context"
            rows="5"
            placeholder="Background notes, rules or facts to keep in mind."
        ></textarea>

        <p id="role-error" class="role-error hidden"></p>

        <div class="role-actions">

            <button
                id="role-delete"
                class="danger-button hidden"
                type="button"
            >
                Delete
            </button>

            <span class="spacer"></span>

            <button
                id="role-close"
                class="ghost-button"
                type="button"
            >
                Close
            </button>

            <button
                class="send-button"
                type="submit"
            >
                Save
            </button>

        </div>

    </form>

</dialog>

<script src="/static/app.js"></script>

</body>
</html>
